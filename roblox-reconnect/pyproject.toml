[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-reconnect"
version = "0.1.0"
description = "Detect and recover from Roblox connection errors by reading the client window"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.9",
    # Windows Graphics Capture: the only capture path that sees through
    # occlusion and keeps working with the display off.
    "windows-capture>=1.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
roblox-reconnect = "reconnect.__main__:main"

[tool.setuptools]
packages = ["reconnect"]

[tool.setuptools.package-dir]
reconnect = "src/reconnect"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
